<!--
  ADVISORY TEAM: INTRO + ADMIN ENTRY ANIMATIONS
  Two paste locations. Nothing else in your file needs to change.

  BLOCK 1 -> paste right after the opening <body> tag
  BLOCK 2 -> paste right before the closing </body> tag (after your main <script>)

  Both animations use your existing logo automatically (it reads the <img class="logo"> in the nav).
  Landing animation: blueprint outline draws itself, fill sweeps in, wordmark fades in, logo zooms through to the page.
  Admin animation:   HUD scanner rings + progress, "Access granted", then a shutter opens to the admin panel.
-->


<!-- ============================ BLOCK 1 of 2 ============================ -->
<style id="intro-fx">
/* ---------- shared ---------- */
@keyframes fxFailsafe{to{opacity:0;visibility:hidden;pointer-events:none}}
#advIntro,#adminfx{position:fixed;inset:0;z-index:10000;overflow:hidden}

/* ---------- LANDING INTRO ---------- */
#advIntro{
  display:grid;place-items:center;cursor:pointer;
  background:radial-gradient(900px 520px at 50% 42%,rgba(38,212,230,.12),transparent 70%),#05080d;
  animation:fxFailsafe 0s linear 10s forwards; /* if JS ever fails, the overlay removes itself */
}
.in-grid{
  position:absolute;inset:-10%;opacity:0;transition:opacity 1s ease;
  background-image:linear-gradient(rgba(38,212,230,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(38,212,230,.08) 1px,transparent 1px);
  background-size:56px 56px;
  -webkit-mask-image:radial-gradient(closest-side at 50% 45%,#000 5%,transparent 78%);
  mask-image:radial-gradient(closest-side at 50% 45%,#000 5%,transparent 78%);
  animation:inDrift 12s linear infinite;
}
#advIntro.go .in-grid{opacity:1}
@keyframes inDrift{to{background-position:56px 56px}}
.in-stage{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 20px}
.in-logo{position:relative;width:clamp(120px,30vw,168px);aspect-ratio:1/1;will-change:transform}
.in-logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;-webkit-user-drag:none;user-select:none}
.in-glow{position:absolute;inset:-45%;border-radius:50%;opacity:0;pointer-events:none;
  background:radial-gradient(closest-side,rgba(38,212,230,.42),transparent);filter:blur(14px)}
.in-ghost{opacity:.14}
.in-edge{
  opacity:0;filter:url(#in-edge);
  -webkit-mask-image:conic-gradient(from -90deg,#000 var(--a,0deg),transparent var(--a,0deg));
  mask-image:conic-gradient(from -90deg,#000 var(--a,0deg),transparent var(--a,0deg));
}
.in-fill{
  -webkit-mask-image:linear-gradient(115deg,#000 calc(var(--p,-12%) - 10%),transparent var(--p,-12%));
  mask-image:linear-gradient(115deg,#000 calc(var(--p,-12%) - 10%),transparent var(--p,-12%));
}
.in-ray{position:absolute;left:50%;top:50%;width:64%;height:2px;margin-top:-1px;opacity:0;transform-origin:0 50%;
  background:linear-gradient(90deg,transparent,#9bf6ff);box-shadow:0 0 14px 2px rgba(38,212,230,.8)}
.in-word{margin-top:28px;font:600 clamp(26px,6vw,40px)/1 var(--sans);letter-spacing:-.02em;color:var(--tx);opacity:0}
.in-word em{font-family:var(--serif);font-style:italic;font-weight:400;color:var(--ac);font-size:1.18em;margin-left:.12em}
.in-line{height:1px;width:0;margin:15px 0 12px;opacity:0;background:linear-gradient(90deg,transparent,var(--ac),transparent)}
.in-tag{font:500 13.5px/1.4 var(--sans);letter-spacing:.03em;color:var(--mu);opacity:0}
.in-skip{position:absolute;right:18px;top:calc(14px + env(safe-area-inset-top,0px));z-index:2;
  font:600 12px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--mu);
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:7px 14px;cursor:pointer}
.in-skip:hover{color:var(--tx)}

/* landing page content rises in as the logo zooms through */
@keyframes heroUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
html.hero-in #top .copy>*{animation:heroUp .85s cubic-bezier(.2,.7,.2,1) both}
html.hero-in #top .copy>*:nth-child(2){animation-delay:.12s}
html.hero-in #top .copy>*:nth-child(3){animation-delay:.24s}

/* ---------- ADMIN ENTRY ---------- */
#adminfx{opacity:0;pointer-events:none;z-index:10001}
#adminfx.on{opacity:1;pointer-events:auto;transition:opacity .25s ease}
.ax-p{position:absolute;left:0;right:0;height:50.6%;background:#03060a}
.ax-top{top:0;background:linear-gradient(to bottom,#03060a,#050a10)}
.ax-bot{bottom:0;background:linear-gradient(to top,#03060a,#050a10)}
.ax-seam{position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;opacity:0;transform:scaleX(0);
  background:linear-gradient(90deg,transparent,#9bf6ff,transparent);box-shadow:0 0 28px 6px rgba(38,212,230,.7)}
.ax-hud{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(520px 360px at 50% 46%,rgba(38,212,230,.14),transparent 70%)}
.ax-c{position:absolute;width:26px;height:26px;border:2px solid rgba(38,212,230,.75);opacity:0;transform:scale(1.7);
  transition:opacity .5s ease .1s,transform .6s cubic-bezier(.2,.7,.2,1) .1s}
#adminfx.on .ax-c{opacity:1;transform:none}
.ax-c.c1{left:max(22px,4vw);top:max(22px,4vh);border-right:0;border-bottom:0}
.ax-c.c2{right:max(22px,4vw);top:max(22px,4vh);border-left:0;border-bottom:0}
.ax-c.c3{left:max(22px,4vw);bottom:max(22px,4vh);border-right:0;border-top:0}
.ax-c.c4{right:max(22px,4vw);bottom:max(22px,4vh);border-left:0;border-top:0}
.ax-core{position:relative;width:min(240px,62vw);aspect-ratio:1/1}
.ax-rings{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ax-rings circle{fill:none;transform-box:fill-box;transform-origin:center}
.ax-rings .t0{stroke:rgba(38,212,230,.22);stroke-width:1;stroke-dasharray:1 5}
.ax-rings .r1{stroke:rgba(38,212,230,.45);stroke-width:1;stroke-dasharray:2 7;animation:axSpin 14s linear infinite}
.ax-rings .r2{stroke:rgba(38,212,230,.9);stroke-width:2;stroke-dasharray:46 30 8 30;animation:axSpin 5s linear infinite reverse}
.ax-rings .r3t{stroke:rgba(255,255,255,.07);stroke-width:3}
.ax-rings .r3{transform:rotate(-90deg);stroke:#26d4e6;stroke-width:3;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;transition:stroke .3s}
@keyframes axSpin{to{transform:rotate(360deg)}}
.ax-logo{position:absolute;inset:27%;overflow:hidden;display:grid;place-items:center}
.ax-logo img{width:100%;height:100%;object-fit:contain;display:block;animation:axPulse 1.6s ease-in-out infinite}
@keyframes axPulse{50%{transform:scale(1.05);filter:drop-shadow(0 0 14px rgba(38,212,230,.7))}}
.ax-scan{position:absolute;left:0;right:0;top:-32%;height:32%;mix-blend-mode:screen;
  background:linear-gradient(to bottom,transparent,rgba(155,246,255,.65),transparent);animation:axScan 1.15s ease-in-out infinite}
@keyframes axScan{to{top:100%}}
.ax-stat{display:flex;gap:14px;align-items:baseline;margin-top:26px;font:700 12.5px var(--sans);letter-spacing:.24em;
  text-transform:uppercase;color:#d6f4f7;font-variant-numeric:tabular-nums}
.ax-stat b{color:var(--ac);letter-spacing:.08em;min-width:3.4ch;text-align:right}
.ax-sub{margin-top:8px;font:500 12px var(--sans);letter-spacing:.08em;color:var(--mu)}
#adminfx.ok .ax-rings .r3,#adminfx.ok .ax-rings .r2{stroke:#3ddc97}
#adminfx.ok .ax-stat,#adminfx.ok .ax-stat b{color:#3ddc97}
#adminfx.ok .ax-c{border-color:rgba(61,220,151,.85)}

@media(prefers-reduced-motion:reduce){#advIntro,#adminfx{display:none!important}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="in-edge" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
    <feMorphology in="SourceAlpha" operator="dilate" radius="1.6" result="d"/>
    <feComposite in="d" in2="SourceAlpha" operator="out" result="ring"/>
    <feFlood flood-color="#9bf6ff"/>
    <feComposite in2="ring" operator="in" result="line"/>
    <feGaussianBlur in="line" stdDeviation="2.2" result="glow"/>
    <feMerge><feMergeNode in="glow"/><feMergeNode in="line"/></feMerge>
  </filter>
</svg>

<!-- Landing intro -->
<div id="advIntro" aria-hidden="true">
  <div class="in-grid"></div>
  <button class="in-skip" id="in-skip" type="button">Skip</button>
  <div class="in-stage">
    <div class="in-logo" id="in-logo">
      <div class="in-glow" id="in-glow"></div>
      <img class="in-ghost" id="in-ghost-img" alt="">
      <img class="in-fill" id="in-fill-img" alt="">
      <img class="in-edge" id="in-edge-img" alt="">
      <div class="in-ray" id="in-ray"></div>
    </div>
    <div class="in-word" id="in-word">Advisory <em>Team</em></div>
    <div class="in-line" id="in-line"></div>
    <div class="in-tag" id="in-tag">Be the one they ask for help.</div>
  </div>
</div>

<!-- Admin entry -->
<div id="adminfx" hidden aria-hidden="true">
  <div class="ax-p ax-top"></div>
  <div class="ax-p ax-bot"></div>
  <div class="ax-seam"></div>
  <div class="ax-hud">
    <i class="ax-c c1"></i><i class="ax-c c2"></i><i class="ax-c c3"></i><i class="ax-c c4"></i>
    <div class="ax-core">
      <svg class="ax-rings" viewBox="0 0 240 240">
        <circle class="t0" cx="120" cy="120" r="118"/>
        <circle class="r1" cx="120" cy="120" r="110"/>
        <circle class="r2" cx="120" cy="120" r="98"/>
        <circle class="r3t" cx="120" cy="120" r="84"/>
        <circle class="r3" id="ax-arc" cx="120" cy="120" r="84" pathLength="100"/>
      </svg>
      <div class="ax-logo"><img id="ax-logo-img" alt=""><i class="ax-scan"></i></div>
    </div>
    <div class="ax-stat"><span id="ax-t">Verifying access</span><b id="ax-n">0%</b></div>
    <div class="ax-sub" id="ax-s">Secure channel</div>
  </div>
</div>

<script id="intro-fx-js">
(function(){
  "use strict";

  /* ---- settings ---- */
  var PLAY_ONCE_PER_SESSION = false;  // true = landing intro plays once per browser tab session

  var $ = function(i){ return document.getElementById(i); };
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var SEC = (typeof SECRET !== "undefined") ? SECRET : "#advisory";
  var intro = $("advIntro"), ax = $("adminfx");
  if (!intro || !ax) return;

  /* use the logo that is already on the page */
  var srcEl = document.querySelector(".brand .logo");
  var LOGO = srcEl ? srcEl.src : "";
  ["in-ghost-img", "in-edge-img", "in-fill-img", "ax-logo-img"].forEach(function(id){
    var i = $(id); if (i && LOGO) i.src = LOGO;
  });
  function ready(){
    var i = $("in-fill-img");
    var d = i && i.decode ? i.decode().catch(function(){}) : Promise.resolve();
    return Promise.race([d, new Promise(function(r){ setTimeout(r, 700); })]);
  }

  /* ---- tiny helpers ---- */
  function Run(){ this.dead = false; this.anims = []; }
  Run.prototype.anim = function(el, kf, o){ var a = el.animate(kf, o); this.anims.push(a); return a; };
  Run.prototype.clear = function(){ this.anims.forEach(function(a){ try{ a.cancel(); }catch(e){} }); this.anims = []; };
  function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
  function tween(run, d, fn, ease){
    return new Promise(function(res){
      var t0 = null;
      function f(t){
        if (run.dead) return res();
        if (t0 === null) t0 = t;
        var k = Math.min(1, (t - t0) / d);
        fn(ease ? ease(k) : k);
        if (k < 1) requestAnimationFrame(f); else res();
      }
      requestAnimationFrame(f);
    });
  }
  var eo  = function(k){ return 1 - Math.pow(1 - k, 3); };
  var eio = function(k){ return k < .5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2; };
  var de = document.documentElement;
  function lock(){ de.style.overflow = "hidden"; }
  function unlock(){ de.style.overflow = ""; }
  function heroIn(){ de.classList.add("hero-in"); setTimeout(function(){ de.classList.remove("hero-in"); }, 2400); }

  /* =====================================================================
     1) LANDING INTRO : outline draws -> fill sweeps -> wordmark -> zoom through
     ===================================================================== */
  async function playIntro(){
    var run = new Run(), over = false;
    var edge = $("in-edge-img"), fill = $("in-fill-img"), ray = $("in-ray"), glow = $("in-glow"),
        logo = $("in-logo"), word = $("in-word"), line = $("in-line"), tag = $("in-tag");

    function finish(){
      if (over) return; over = true;
      run.clear(); intro.hidden = true; unlock();
      document.removeEventListener("keydown", onKey);
    }
    function skip(){
      if (run.dead) return; run.dead = true;
      heroIn();
      run.anim(intro, [{opacity:1},{opacity:0}], {duration:320, fill:"forwards"}).finished.then(finish, finish);
    }
    function onKey(e){ if (e.key === "Escape" || e.key === "Enter" || e.key === " ") skip(); }
    intro.addEventListener("click", skip);
    document.addEventListener("keydown", onKey);

    intro.hidden = false; lock();
    await ready(); if (run.dead) return;
    intro.classList.add("go");
    await sleep(300); if (run.dead) return;

    /* a) blueprint outline is traced by a sweeping beam */
    edge.style.opacity = 1; ray.style.opacity = 1;
    await tween(run, 1150, function(k){
      var a = k * 360;
      edge.style.setProperty("--a", a + "deg");
      ray.style.transform = "rotate(" + (a - 90) + "deg)";
      glow.style.opacity = k * .45;
    }, eio);
    if (run.dead) return;
    ray.style.opacity = 0;

    /* b) solid logo sweeps in over the outline */
    logo.style.transform = "scale(1.07)";
    await tween(run, 750, function(k){
      fill.style.setProperty("--p", (-12 + k * 140) + "%");
      edge.style.opacity = 1 - k * .8;
      glow.style.opacity = .45 + k * .55;
      logo.style.transform = "scale(" + (1.07 - .07 * k) + ")";
    }, eo);
    if (run.dead) return;
    run.anim(logo, [{transform:"scale(1)"},{transform:"scale(1.06)"},{transform:"scale(1)"}], {duration:420, easing:"ease-out"});

    /* c) wordmark, divider, tagline */
    run.anim(word, [
      {opacity:0, filter:"blur(14px)", transform:"translateY(10px)", letterSpacing:".12em"},
      {opacity:1, filter:"blur(0)",    transform:"none",             letterSpacing:"-.02em"}
    ], {duration:750, easing:"cubic-bezier(.2,.7,.2,1)", fill:"forwards"});
    run.anim(line, [{width:"0px", opacity:0},{width:"130px", opacity:1}], {duration:600, delay:250, easing:"ease-out", fill:"forwards"});
    run.anim(tag,  [{opacity:0, transform:"translateY(6px)"},{opacity:1, transform:"none"}], {duration:600, delay:480, fill:"forwards"});
    await sleep(1550); if (run.dead) return;

    /* d) zoom through the logo into the page */
    heroIn();
    [word, line, tag].forEach(function(e){ run.anim(e, [{opacity:1},{opacity:0}], {duration:300, fill:"forwards"}); });
    run.anim(logo, [{transform:"scale(1)"},{transform:"scale(24)"}], {duration:950, easing:"cubic-bezier(.7,0,.9,.4)", fill:"forwards"});
    var fade = run.anim(intro, [{opacity:1},{opacity:0}], {duration:560, delay:420, easing:"ease-in", fill:"forwards"});
    await fade.finished.catch(function(){});
    finish();
  }

  /* =====================================================================
     2) ADMIN ENTRY : scanner HUD -> access granted -> shutter opens
     ===================================================================== */
  var axBusy = false;
  async function adminFx(nav, instant){
    if (axBusy) return; axBusy = true;
    if (reduce){ if (nav) location.hash = SEC; axBusy = false; return; }

    var run = new Run(), top = ax.querySelector(".ax-top"), bot = ax.querySelector(".ax-bot"),
        seam = ax.querySelector(".ax-seam"), hud = ax.querySelector(".ax-hud"),
        arc = $("ax-arc"), t = $("ax-t"), n = $("ax-n"), s = $("ax-s");

    ax.classList.remove("ok");
    arc.style.strokeDashoffset = 100;
    t.textContent = "Verifying access"; s.textContent = "Secure channel"; n.textContent = "0%";
    if (instant) ax.style.transition = "none";
    ax.hidden = false; void ax.offsetWidth; ax.classList.add("on"); lock();
    if (instant){ void ax.offsetWidth; ax.style.transition = ""; }
    await ready();

    var stages = [["Verifying access","Secure channel"],["Authenticating","Checking credentials"],["Loading admin","Preparing workspace"]], si = -1;
    await tween(run, 1900, function(k){
      var p = k * 100;
      arc.style.strokeDashoffset = 100 - p;
      n.textContent = Math.floor(p) + "%";
      var j = p >= 68 ? 2 : p >= 34 ? 1 : 0;
      if (j !== si){ si = j; t.textContent = stages[j][0]; s.textContent = stages[j][1]; }
    }, eio);

    ax.classList.add("ok");
    t.textContent = "Access granted"; s.textContent = "Welcome back"; n.textContent = "100%";
    arc.style.strokeDashoffset = 0;
    await sleep(450);

    if (nav) location.hash = SEC;           /* admin renders underneath the closed shutter */
    await sleep(nav ? 300 : 0);

    run.anim(hud,  [{opacity:1, transform:"scale(1)"},{opacity:0, transform:"scale(1.12)"}], {duration:350, easing:"ease-in", fill:"forwards"});
    run.anim(seam, [{opacity:0, transform:"scaleX(0)"},{opacity:1, transform:"scaleX(1)"}], {duration:350, easing:"ease-out", fill:"forwards"});
    await sleep(300);

    var ease = "cubic-bezier(.76,0,.24,1)";
    run.anim(top, [{transform:"none"},{transform:"translateY(-101%)"}], {duration:750, easing:ease, fill:"forwards"});
    var b = run.anim(bot, [{transform:"none"},{transform:"translateY(101%)"}], {duration:750, easing:ease, fill:"forwards"});
    run.anim(seam, [{opacity:1},{opacity:0}], {duration:400, delay:350, fill:"forwards"});
    await b.finished.catch(function(){});

    run.clear();
    ax.classList.remove("on", "ok"); ax.hidden = true; unlock(); axBusy = false;
  }

  /* intercept the secret code (runs before your existing search handler) */
  document.addEventListener("submit", function(e){
    if (!e.target || e.target.id !== "sx") return;
    var q = ($("sq").value || "").trim().toLowerCase();
    if (q !== SEC.toLowerCase()) return;     /* normal search keeps working */
    e.preventDefault(); e.stopImmediatePropagation();
    try { sClose(); } catch (x) {}
    $("sq").blur();
    adminFx(true, false);
  }, true);

  /* ---- first load ---- */
  var seen = false;
  try { seen = PLAY_ONCE_PER_SESSION && sessionStorage.getItem("advIntroSeen"); } catch (e) {}
  if (location.hash === SEC && !reduce){        /* opened straight on the admin link */
    intro.hidden = true; adminFx(false, true);
  } else if (reduce || seen){
    intro.hidden = true;
  } else {
    try { sessionStorage.setItem("advIntroSeen", "1"); } catch (e) {}
    playIntro();
  }
})();
</script>
